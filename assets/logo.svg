<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" role="img" aria-label="Token Snack">
  <!-- Green tile -->
  <rect x="2" y="8" width="28" height="28" rx="7" fill="#1D9E75"/>
  <!-- Purple tile -->
  <rect x="38" y="8" width="28" height="28" rx="7" fill="#7F77DD"/>
  <!-- Orange snack tile with bite (mask) -->
  <defs>
    <mask id="bite">
      <rect x="74" y="8" width="28" height="28" rx="7" fill="white"/>
      <circle cx="102" cy="12" r="7" fill="black"/>
      <circle cx="104" cy="22" r="4.5" fill="black"/>
    </mask>
  </defs>
  <rect x="74" y="8" width="28" height="28" rx="7" fill="#C77D2E" mask="url(#bite)"/>
  <!-- Crumbs -->
  <circle cx="104" cy="40" r="2.2" fill="#C77D2E"/>
  <circle cx="110" cy="38" r="1.6" fill="#C77D2E"/>
  <circle cx="107" cy="44" r="1.3" fill="#C77D2E"/>
</svg>
